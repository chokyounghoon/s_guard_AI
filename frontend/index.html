<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sguard-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🕹️ PWA Setting -->
    <meta name="theme-color" content="#0a0e17" />
    <link rel="manifest" href="/manifest.json" />

    <!-- PWA 지원 (Legacy + Modern) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="S-Guard" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>S-Guard AI</title>
    <!-- 🏢 신한 디지털 금융 관제 표준 디자인 시스템 폰트 체계: One Shinhan(Display) + Pretendard(Body) + Roboto/JetBrains Mono(Numeric tnum) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        font-family: 'One Shinhan', 'One Shinhan Sans', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'SF Pro Text', Inter, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: -0.022em;
        word-break: keep-all;
        overflow-wrap: break-word;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background: #060C1B;
        color: #f1f5f9;
      }
      /* 금융 수치 및 인터페이스 코드 고정폭(tabular figures) 적용 */
      .font-shinhan-num, .font-mono, [class*="font-mono"], code, pre, kbd, samp {
        font-family: 'Roboto', 'JetBrains Mono', 'SF Mono', monospace;
        font-feature-settings: 'tnum' 1, 'zero' 1;
        letter-spacing: -0.01em;
      }
      .font-shinhan-display {
        font-family: 'One Shinhan', 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
