<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sguard-icon.svg" />

    <!-- 📱 모바일 최적화 뷰포트 (iOS 스케일/스크롤 락) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- 🕹️ PWA 설정 -->
    <meta name="theme-color" content="#0a0e17" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA 설정 (안드로이드와 동일하게 상단바 분리: black-translucent 대신 black) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="S-Guard" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Android Chrome PWA 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO -->
    <title>S-Guard AI | 장애 관제 모바일</title>
    <meta name="description" content="S-Guard AI 장애관제 시스템 - 모바일 전용 인터페이스" />

    <!-- 성능: 폰트 프리로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Pretendard: 한글 최적화 + IT 영문/숫자 가독성 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* ── 기본 리셋 ── */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { 
        margin: 0; padding: 0; 
        width: 100%; height: 100%;
        overflow-x: hidden; /* 좌우측 흔들림/스크롤 방지 */
        background: #0a0e17; 
        color: #f1f5f9;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        /* ── Pretendard 우선, Noto Sans KR 폴백 ── */
        font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: -0.02em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* iOS Safe Area 지원 */
      #mobile-root {
        /* safe-area-inset-top은 sticky nav에서 직접 처리 → 중복 padding 제거 */
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* iOS 노치/Dynamic Island: sticky top nav에 safe area 적용 */
      .mobile-top-nav {
        padding-top: env(safe-area-inset-top, 0px);
        min-height: calc(56px + env(safe-area-inset-top, 0px));
      }
    </style>
    <script type="module" crossorigin src="/assets/index.mobile-D-h0Ni42.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-By-x9DNw.css">
  </head>
  <body>
    <div id="mobile-root"></div>
  </body>
</html>
