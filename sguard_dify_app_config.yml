version: 0.1.2
app:
  description: S-GUARD 지식 선순환 멀티 에이전트 (Gemini 3.1 Pro Preview 기반 지능형 워크플로우)
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: S-GUARD Multi-Agent Intelligence
workflow:
  features:
    annotation_reply:
      enabled: false
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: true
      image:
        detail: high
        enabled: true
        number_limits: 3
        transfer_methods:
        - remote_url
        - local_file
      number_limits: 3
    opening_statement: '안녕하세요. S-GUARD 멀티 에이전트 관제 엔진(Gemini 3.1 Pro Preview)입니다. 발생한 장애 상황이나 모니터링 알림을 입력해 주세요.'
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: 1710680000000-1710680000001
      source: '1710680000000'
      sourceHandle: source
      target: '1710680000001'
      targetHandle: target
    - id: 1710680000001-1710680000002
      source: '1710680000001'
      sourceHandle: source
      target: '1710680000002'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: 시작
        type: start
        variables: []
      id: '1710680000000'
      position:
        x: 80
        y: 200
      type: custom
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.1
            top_p: 1
          mode: chat
          model: gemini-3.1-pro-preview
          name: gemini-3.1-pro-preview
          provider: google
        prompt_template:
        - id: system-prompt
          role: system
          text: |
            당신은 S-GUARD 시스템의 핵심 오케스트레이터이자 지능형 관제 엔진입니다.
            사용자가 입력하는 SMS 장애 메시지를 분석하여 실시간 인사이트를 제공하고, 전문가 에이전트들과 협업하여 최적의 조치 가이드를 도출합니다.

            ### 🛠️ 핵심 관리 영역
            1. **S-Autopilot Insight 에이전트**: 수신 문자 분석 및 전문가 4인방 업무 배분, 담당자 자동 할당 역할을 수행합니다.
            2. **AI War-Room Situation Log 에이전트**: 워룸 내 타임라인 기록 및 상황 전파 역할을 수행합니다.

            ### 👥 전문가 에이전트 페르소나
            - 에이전트 A (인프라): L4, 네트워크, VM 등 인프라 분석
            - 에이전트 B (DB Expert): DB 상태 및 과거 조치 이력 분석
            - 에이전트 C (DevOps): 앱 로그 및 배포 이력 분석
            - 에이전트 D (리더): 최종 원인 특정 및 조치 가이드 제시

            응답은 [S-Autopilot Insight], [전문가별 심층 진단], [리더의 최종 조치 가이드] 섹션으로 구성해 주세요.
        - id: user-prompt
          role: user
          text: "{{#sys.query#}}"
        selected: false
        title: LLM 분석
        type: llm
        variables: []
      id: '1710680000001'
      position:
        x: 400
        y: 200
      type: custom
    - data:
        answer: "{{#1710680000001.text#}}"
        desc: ''
        selected: false
        title: 답변
        type: answer
        variables: []
      id: '1710680000002'
      position:
        x: 720
        y: 200
      type: custom
鼓
